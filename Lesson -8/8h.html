<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>8h</title>
</head>
<body>
    <button  class="btn"   id="one"></button>
    <button   class="btn"  id="two"></button>
      <button  class="btn"   id="three"></button>
    <button   class="btn"  id="four"></button>
      <button  class="btn"  id="five"></button>
    <button  class="btn"  id="six"></button>
      <button class="btn"  id="seven"></button>
    <button  class="btn"  id="eight"></button>
      <button class="btn"   id="nine"></button>
    <button       id="equal"></button>
      <button  class="btn"  id="add"></button>
    <button   class="btn"  id="sub"></button>
      <button   class="btn" id="zero"></button>
     
      <script>
       

        let calculation = localStorage.getItem('calculation') || '';
         let buttons = document.querySelectorAll(".btn");
         let equal = document.getElementById('equal');
      
         function draw(name,value){
            name.innerHTML = value;
         }
      draw(one,'1');
      draw(two,'2');
      draw(three,'3');
      draw(four,'4');
      draw(five,'5');
      draw(six,'6');
      draw(seven,'7');
      draw(eight,'8');
      draw(nine,'9');
      draw(zero,'0');
      draw(add,'+');
      draw(sub,'-');
      draw(equal,'=');



 buttons.forEach((btn) =>{
       btn.addEventListener("click", ()=>{
          calculation = calculation +btn.innerHTML;
          console.log(calculation);
       })
 });
    
     equal.onclick = () =>{
        calculation =eval(calculation);
        console.log(calculation);
        localStorage.setItem('calculation', calculation);
     }
  
      </script>

</body>
</html>
