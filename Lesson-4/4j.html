<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4i</title>
</head>
<body>
    <p id="title"></p>
    <p id="price"></p>
    <button id="cart"></button>
    <button id="buynow"></button>



    <script>
        let title =document.getElementById('title');
        let price = document.getElementById('price');
        let cart =  document.getElementById('cart');
        let buy = document.getElementById('buynow');
           
        title.innerHTML="Adult Plain Cotton T-shirt";
        price.innerHTML="Price :$7.99";
        cart.innerHTML="Add to cart";
        buy.innerHTML="Buy Now";
      
       
        title.style.fontSize='20px';
     cart.style.backgroundColor='red';

            cart.innerHTML ="Add to cart";
           cart.style.height='35px';
           cart.style.width='80px';
            cart.style.border='none';
            
        buy.innerText="Buy now";
        buy.style.background='yellow';
        buy.style.height='35px';
        buy.style.width='80px';
        buy.style.border='none';


        cart.onclick =()=>{
            alert('Added');
        }
        buy.onclick =()=>{
            alert('Loading...');
            alert('purchased');
        }
    </script>
</body>
</html>
