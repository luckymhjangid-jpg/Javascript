<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>10e</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      margin-top: 3rem;
      font-family: sans-serif;
    }

    .container {
      display: flex;
      gap: 1.5rem;
    }

    
    .btn {
      height: 60px;
      padding: 0 24px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s, color 0.2s;
    }

    
    #gaming {
      background-color: rgb(255, 216, 20);
      color: black;
    }

    #music {
      background-color: #15370d;
      color: yellow;
    }

    #tech {
      background-color: #36415a;
      color: #aa5e7a;
    }

    
    .btn.is-toggled {
      background-color: red !important;
      color: blue !important;
    }
  </style>
</head>
<body>

  <div class="container">
    <button id="gaming" class="btn">Gaming</button>
    <button id="music" class="btn">Music</button>
    <button id="tech" class="btn">Tech</button>
  </div>

  <script>
    const buttons = document.querySelectorAll('.btn');

    
    buttons.forEach((button) => {
      button.addEventListener('click', () => {
        button.classList.toggle('is-toggled');
      });
    });
  </script>
</body>
</html>
