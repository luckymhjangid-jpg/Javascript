 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10e</title>
</head>
<body>
 <div id="div">
    <button id="gaming" class="js-btn"></button>
    <button id="music" class="js-btn"></button>
    <button id="tech"  class="js-btn"></button>
 </div>
    <style>
        body{
            justify-self:center;
            text-align: center;
            display: flex;
        }
        div{
            margin-top: 3rem;
        }
        #gaming{
            margin-left: 2px;
            
            
        }

        #music{
            margin-left: 3rem;
        }
        #tech{
            margin-left: 3rem;
        }

    </style>
    <script>
        let gaming = document.querySelector('#gaming');
        let music = document.querySelector('#music');
        let tech = document.querySelector('#tech');
        let buttons = document.querySelectorAll('.js-btn');

        gaming.textContent='Gaming';
        gaming.style.height = '60px';
        gaming.style.width = '100px';
        gaming.style.color ='black';
        gaming.style.backgroundColor ='rgb(255,216,20)';
        gaming.style.border ='none';
        gaming.style.borderRadius ='8px';
        gaming.style.fontSize ='20px';
        gaming.style.padding='20px 20px';
        
        music.textContent='Music';
        music.style.height = '60px';
        music.style.width = '100px';
        music.style.color ='yellow';
        music.style.backgroundColor ='#15370D';
        music.style.border ='none';
        music.style.borderRadius ='8px';
        music.style.fontSize ='20px';
        music.style.padding = '20px 20px';

        
        tech.textContent='Tech';
        tech.style.height = '60px';
        tech.style.width = '100px';
        tech.style.color ='#AA5E7A';
        tech.style.backgroundColor ='#36415A';
        tech.style.border ='none';
        tech.style.borderRadius ='8px';
        tech.style.fontSize ='20px';
        tech.style.padding = '20px 20px';

        function change(name,classonecolor,classtwocolor,classonebgcolorname,classtwobgcolorname){
 
            if(name.classList.contains('is-toggled')){
                name.setAttribute('class','js-btn');
                name.style.color=classonecolor;
                name.style.backgroundColor=classonebgcolorname;
                console.log(name.getAttribute('class'));
            }
            else if(name.classList.contains('js-btn')){
                name.setAttribute('class','is-toggled');
                name.style.color=classtwocolor;
                name.style.backgroundColor=classtwobgcolorname;
                console.log(name.getAttribute('class'));
            }
        }
       buttons.forEach((button)=>{
            button.addEventListener("click",()=>{
                change(button,'black','red','#AA5E7A','#36415A');
            })
       });
            
        
  
    </script>
</body>
</html>
