 <!DOCTYPE html>
 <html lang="en">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
 </head>
 <body>
  <button id="gaming" class="btn"></button>
  <script>
    let gaming =document.querySelector('#gaming');
    gaming.textContent='Gaming';  
    
    function func(name,colr,backgroundColor){
      name.style.color = colr;
     name.style.backgroundColor = backgroundColor;
  
    }
    gaming.addEventListener("click",()=>{
      func(gaming,'red','blue');
    })
 
  </script>
 </body>
 </html>
